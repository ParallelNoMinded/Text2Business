openapi: 3.0.3
info:
  title: Text2Business AI-Dispatcher API (As-Is Express Monolith)
  description: OpenAPI 3.0 спецификация текущегоExpress сервера и OData эмулятора 1С
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Current Node.js / Express Container

paths:
  /api/webhooks/dispatch:
    post:
      summary: Синхронная диспетчеризация входящего обращения (Telegram, Email, Telephony, REST)
      operationId: dispatchMessageCurrent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  example: TELEGRAM
                sender:
                  type: string
                  example: ООО "СеверФуд"
                text:
                  type: string
                  example: Срочно сломался компрессор ХУ-17 на объекте Северный
      responses:
        '200':
          description: Результат извлечения фактов и статус создания тикета
    get:
      summary: Проверка работоспособности и Swagger-тест
      operationId: getDispatchStatusCurrent
      responses:
        '200':
          description: Статус диспетчера

  /api/llm/config:
    post:
      summary: Динамическая передача GITHUB_MODELS_TOKEN и выбор активной модели
      operationId: configureLLMCurrent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                model:
                  type: string
                  example: gpt-4o
      responses:
        '200':
          description: Успешное обновление токена и модели

  /api/1c/tickets:
    get:
      summary: OData REST реестр ЗаявокНаРемонт
      operationId: get1cTicketsCurrent
      responses:
        '200':
          description: Список документов OData JSON
    post:
      summary: Эмуляция проведения документа ЗаявкаНаРемонт в 1С:ERP
      operationId: post1cTicketsCurrent
      responses:
        '200':
          description: Результат проведения
